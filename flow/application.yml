server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/mydatabase
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  redis:
    host: redis
    port: 6379

jwt:
  secret: mysecretkey
  expiration: 86400000 # 1 day in milliseconds

security:
  oauth2:
    client:
      registration:
        google:
          client-id: your-client-id
          client-secret: your-client-secret
          scope: profile, email
